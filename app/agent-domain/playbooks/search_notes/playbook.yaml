playbook_id: search_notes
name: Search Notes
description: >-
  Find the notes themselves rather than answering from their content. Use this
  playbook when the user wants to locate notes, browse a folder, or see which
  notes mention something, and the expected result is a list of notes with
  where they live.

  Verbs decide it against the question-answering playbook: find, locate,
  search, list, show me, pull up, which notes, where did I write, do I have a
  note about. All of these want notes back, so they belong here rather than
  with question answering - including when the request names a topic, as in
  "find me the notes where I wrote about X".

  They do not decide it against the timeline playbook. A request anchored to a
  period - last week, in January, since Monday, recently - belongs there even
  when it opens with one of these verbs.
examples:
  - Find my notes about the vendor migration.
  - Which notes mention Postgres?
  - Show me the notes in my Work folder.
  - List my pinned notes.
  - Where did I write about the onboarding checklist?
  - What folders do I have?
plans:
  - name: find_notes
    description: >-
      Locate notes semantically related to the request and return references
      with snippets and folder placement. The default when the request names a
      topic rather than a filter.
    steps:
      - step: resolve_filters
      - step: validate_filters
      - step: semantic_search
        operation: locate_notes
      - step: aggregation

  - name: browse_notes
    description: >-
      List notes by explicit workspace filters - folder, pinned state, or title
      text - when the request names a concrete filter instead of a topic.
    steps:
      - step: resolve_filters
      - step: validate_filters
      - step: execute_operation
        operation: list_notes
      - step: aggregation

  - name: browse_folders
    description: >-
      List the user's folders so the workspace layout can be inspected before
      choosing notes.
    steps:
      - step: execute_operation
        operation: list_folders
      - step: aggregation

  - name: browse_tags
    description: >-
      List the tags that exist in the workspace. Reading tags, not applying
      them.
    steps:
      - step: execute_operation
        operation: list_tags
      - step: aggregation

  - name: open_note
    description: >-
      Read one specific note back to the user when they identify the note
      itself rather than describing a topic to search for.
    steps:
      - step: execute_operation
        operation: get_note
      - step: aggregation
