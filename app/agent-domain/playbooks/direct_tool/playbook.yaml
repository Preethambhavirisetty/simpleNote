playbook_id: direct_tool
name: Direct Tool
description: >-
  Perform one explicit workspace action on a note, folder, or tag. Use this
  playbook when the request is an instruction to create, update, move, delete,
  or tag something rather than a question to answer. Each plan is a single
  operation; destructive ones pause for approval before they run.
examples:
  - Create a note called Sprint Retro in my Work folder.
  - Rename the folder Personal to Life Admin.
  - Move the meeting notes into the Archive folder.
  - Delete the note titled Draft Ideas.
  - Tag this note as urgent.
  - Pin my roadmap note.
plans:
  - name: create_note
    description: Create a new note in a folder, optionally with body text.
    steps:
      - step: direct_tool
        operation: create_note

  - name: update_note
    description: >-
      Change a note's title, description, body, folder, pinned state, or
      memory-inclusion flag.
    steps:
      - step: direct_tool
        operation: update_note

  - name: move_note
    description: Move a note into a different folder.
    steps:
      - step: direct_tool
        operation: move_note

  - name: delete_note
    description: Delete a note from the workspace.
    steps:
      - step: direct_tool
        operation: delete_note

  - name: inspect_note
    description: Open one known note and read it back to the user.
    steps:
      - step: direct_tool
        operation: get_note

  - name: create_folder
    description: Create a new folder in the workspace.
    steps:
      - step: direct_tool
        operation: create_folder

  - name: update_folder
    description: Rename a folder or change its pinned state.
    steps:
      - step: direct_tool
        operation: update_folder

  - name: delete_folder
    description: Delete a folder and the indexing of the notes inside it.
    steps:
      - step: direct_tool
        operation: delete_folder

  - name: list_tags
    description: Show the tags that already exist before tagging something.
    steps:
      - step: direct_tool
        operation: list_tags

  - name: create_tag
    description: Create a new tag.
    steps:
      - step: direct_tool
        operation: create_tag

  - name: update_tag
    description: Rename an existing tag.
    steps:
      - step: direct_tool
        operation: update_tag

  - name: delete_tag
    description: Delete a tag from the workspace.
    steps:
      - step: direct_tool
        operation: delete_tag

  - name: add_tag_to_note
    description: Attach an existing tag to a note.
    steps:
      - step: direct_tool
        operation: add_tag_to_note

  - name: remove_tag_from_note
    description: Remove a tag from a note.
    steps:
      - step: direct_tool
        operation: remove_tag_from_note
