playbook_id: note_timeline
name: Note Timeline
description: >-
  Answer time-scoped questions about notes: what was written or changed in a
  date range, which notes are the most recent, or how work progressed over
  time. Use this playbook whenever the request is anchored to a period rather
  than to a topic alone.
examples:
  - What did I write last week?
  - Show my notes from March.
  - What are my most recent notes?
  - What have I worked on since Monday?
  - Give me a timeline of my project notes.
  - Which notes did I update yesterday?
plans:
  - name: recent_notes
    description: >-
      List the notes in the requested time window, newest first. The answer is
      the list itself - titles and dates. Use for "what did I write/add/touch"
      and "show me my notes from X", where naming the notes answers it.
    steps:
      - step: resolve_filters
      - step: validate_filters
      - step: execute_operation
        operation: list_notes
      - step: sort_by_date
      - step: aggregation

  - name: timeline_digest
    description: >-
      Order the notes in the window by date and write a narrative account of
      the activity. Use when the user wants prose about the period rather than
      a list - "summarize my week", "walk me through", "what was I working on",
      "give me the history". If a bare list of note titles would answer the
      request, use recent_notes instead.
    steps:
      - step: resolve_filters
      - step: validate_filters
      - step: semantic_search
        operation: locate_notes
      - step: sort_by_date
      - step: summarize
