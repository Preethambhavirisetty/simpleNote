# notelite v2 — full-stack compose
#
# Usage:
#   podman-compose up -d               # start everything
#   podman-compose logs -f backend     # tail logs for one service
#   podman-compose down                # stop and remove containers
#
# Frontend: run on the host (Vite HMR doesn't work well in containers):
#   cd app/frontend && npm install && npm run dev
#
# NOTE: depends_on is intentionally omitted — podman-compose blocks forever
# waiting for service_started/service_healthy conditions. Services use
# restart: unless-stopped to recover if a dependency isn't ready yet.
#
# Secrets come from the root .env file (same directory as this file).

x-redis-url: &redis-url "redis://:${REDIS_PASSWORD}@redis:6379/0"
x-pg-url:    &pg-url    "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/notelite"

networks:
  notelite-net:
    driver: bridge

volumes:
  agentlog-data:
  postgres-data:
  qdrant-data:

services:

  # ── Frontend (React + nginx) ────────────────────────────────────────────────

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: notelite-frontend
    restart: unless-stopped
    volumes:
      - ./certs/notelite.org/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/notelite.org/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - notelite-net

  # ── Infrastructure ───────────────────────────────────────────────────────────

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: notelite-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    expose:
      - "6379"
    networks:
      - notelite-net

  postgres:
    image: docker.io/library/postgres:16
    container_name: notelite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notelite
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - notelite-net

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: notelite-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - notelite-net
    ports:
      - "127.0.0.1:6333:6333"

  # ── Observability ────────────────────────────────────────────────────────────

  backend:
    env_file:
      - ./app/backend/.env
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: notelite-backend
    restart: unless-stopped
    environment:
      POSTGRES_DB_URL:        *pg-url
      MESSAGE_BROKER_URL:     *redis-url
      CELERY_RESULT_BACKEND:  *redis-url
      FEATURE_FLAGS_PATH:     /app/feature_flags.json
      AGENT_INTERNAL_URL:     http://agent:8000
      AGENT_WORKFLOW_INTERNAL_URL: http://agent-runtime:8200
      AGENT_WORKFLOW_API_KEY:  ${AGENT_API_KEY}
      AGENT_WORKFLOW_CONFIG_NAME: notelite
      # Auth cookies only over HTTPS — the containerized stack is served via nginx TLS.
      # `environment:` overrides env_file, so a stale app/backend/.env cannot disable this.
      COOKIE_SECURE:          "true"
    volumes:
      - ./feature_flags.json:/app/feature_flags.json:ro
    expose:
      - "8000"
    networks:
      - notelite-net

  # ── Agent (FastAPI RAG service) ──────────────────────────────────────────────

  agent:
    env_file:
      - ./app/orchestrator/.env
    build:
      context: ./app/orchestrator
      dockerfile: Dockerfile
    container_name: notelite-agent
    restart: unless-stopped
    environment:
      QDRANT_URL:             http://qdrant:6333
      BACKEND_INTERNAL_URL_BASE: http://backend:8000/api/conversations/internal
      MESSAGE_BROKER_URL:     *redis-url
      CELERY_RESULT_BACKEND:  *redis-url
      POSTGRES_DB_URL:        *pg-url
      FEATURE_FLAGS_PATH:     /app/feature_flags.json
      AGENT_WORKFLOW_INTERNAL_URL: http://agent-runtime:8200
      AGENT_WORKFLOW_API_KEY:  ${AGENT_API_KEY}
      AGENT_WORKFLOW_CONFIG_NAME: notelite
    volumes:
      - ./app/orchestrator/app:/app/app:ro
      - ./feature_flags.json:/app/feature_flags.json:ro
      - ./app/orchestrator/app/shared/prompts:/app/app/shared/prompts:ro
    expose:
      - "8000"
    networks:
      - notelite-net

  # Notelite MCP tool server — read-only tools exposed to agent-workflow
  agent-mcp:
    env_file:
      - ./app/orchestrator/.env
    build:
      context: ./app/orchestrator
      dockerfile: Dockerfile
    container_name: notelite-agent-mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp.main"]
    environment:
      MCP_HOST:               0.0.0.0
      MCP_ALLOWED_HOSTS:      agent-mcp:8000,agent-mcp,localhost:8000,127.0.0.1:8000
      QDRANT_URL:             http://qdrant:6333
      BACKEND_INTERNAL_URL_BASE: http://backend:8000/api/conversations/internal
      MESSAGE_BROKER_URL:     *redis-url
      CELERY_RESULT_BACKEND:  *redis-url
      POSTGRES_DB_URL:        *pg-url
      FEATURE_FLAGS_PATH:     /app/feature_flags.json
      RUN_MIGRATIONS:         "false"
    volumes:
      - ./app/orchestrator/app:/app/app:ro
      - ./feature_flags.json:/app/feature_flags.json:ro
      - ./app/orchestrator/app/shared/prompts:/app/app/shared/prompts:ro
    expose:
      - "8000"
    networks:
      - notelite-net

  # Standalone agent workflow orchestration service
  # ── Observability: agent run tracker (app/observability/) ───────────────────

  agentlog-mysql:
    image: docker.io/library/mysql:8.4
    container_name: notelite-agentlog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AGENTLOG_MYSQL_PASSWORD:-devroot}
      MYSQL_DATABASE:      agentlog
    volumes:
      - agentlog-data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - notelite-net

  # Port 8500, not the app default 8000: that collides with the backend.
  agentlog-api:
    build:
      context: ./app/observability/backend
      dockerfile: Dockerfile
    container_name: notelite-agentlog-api
    restart: unless-stopped
    environment:
      MYSQL_HOST:     agentlog-mysql
      MYSQL_PORT:     "3306"
      MYSQL_USER:     root
      MYSQL_PASSWORD: ${AGENTLOG_MYSQL_PASSWORD:-devroot}
      MYSQL_DATABASE: agentlog
      AGENTLOG_STATIC_DIR: /app/static
    volumes:
      # The built dashboard, served by the API itself: one port, no proxy.
      - ./app/observability/frontend/dist:/app/static:ro
    expose:
      - "8000"
    ports:
      - "8500:8000"
    networks:
      - notelite-net

  # Agent Domain — declarative catalog: playbooks, operations, MCP mappings
  agent-domain:
    build:
      context: ./app/agent-domain
      dockerfile: Dockerfile
    container_name: notelite-agent-domain
    restart: unless-stopped
    environment:
      # Ranking is served by the inference host, same as the orchestrator.
      EC2_INFERENCE_BASE_IP:  ${EC2_INFERENCE_BASE_IP}
      EMBEDDING_MODEL:        ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_API_KEY:      ${EMBEDDING_API_KEY}
      PLAYBOOK_CANDIDATE_LIMIT: "7"
    volumes:
      # The catalog is data, not code: mount it so editing a playbook takes
      # effect on restart instead of needing an image rebuild.
      - ./app/agent-domain/playbooks:/app/playbooks:ro
      - ./app/agent-domain/operations.yaml:/app/operations.yaml:ro
      - ./app/agent-domain/mappings.yaml:/app/mappings.yaml:ro
      - ./app/agent-domain/steps.yaml:/app/steps.yaml:ro
    expose:
      - "8100"
    networks:
      - notelite-net

  # Agent Runtime — routes a request to a playbook and executes its plan.
  # Replaces agent-workflow-service; it serves the same /api/agent-workflow
  # paths and SSE events, so the orchestrator needs no code change.
  agent-runtime:
    env_file:
      - ./app/agent-runtime/.env
    build:
      context: ./app/agent-runtime
      dockerfile: Dockerfile
    container_name: notelite-agent-runtime
    restart: unless-stopped
    environment:
      DOMAIN_API_BASE:        http://agent-domain:8100
      MCP_SERVERS:            notelite=http://agent-mcp:8000/mcp
      AGENT_WORKFLOW_API_KEY: ${AGENT_API_KEY}
      # Writes stay off until a run can pause for approval and resume.
      MUTATIONS_ENABLED:      "false"
      PLAYBOOK_SELECTION_MODE: single
      # Run logging into app/observability/. Harmless when the collector is down:
      # every log call becomes a no-op rather than failing the request.
      AGENTLOG_ENABLED:       "true"
      AGENTLOG_ENDPOINT:      http://agentlog-api:8000
      PYTHONPATH:             /app:/opt/agentlog
    volumes:
      # One copy of the SDK, mounted rather than vendored into the image.
      - ./app/observability/sdk:/opt/agentlog:ro
      # Source mounted read-only, as the agent service does: a code change
      # needs a restart, not an image rebuild.
      - ./app/agent-runtime/api:/app/api:ro
      - ./app/agent-runtime/graph:/app/graph:ro
      - ./app/agent-runtime/integrations:/app/integrations:ro
      - ./app/agent-runtime/loaders:/app/loaders:ro
      - ./app/agent-runtime/routing:/app/routing:ro
      - ./app/agent-runtime/schemas:/app/schemas:ro
      - ./app/agent-runtime/state:/app/state:ro
      - ./app/agent-runtime/workflows:/app/workflows:ro
      - ./app/agent-runtime/prompts:/app/prompts:ro
      - ./app/agent-runtime/config.py:/app/config.py:ro
      - ./app/agent-runtime/utils.py:/app/utils.py:ro
    expose:
      - "8200"
    networks:
      - notelite-net

  # Agent Celery worker — ingestion + conversation queues
  agent-celery:
    env_file:
      - ./app/orchestrator/.env
    build:
      context: ./app/orchestrator
      dockerfile: Dockerfile
    container_name: notelite-agent-celery
    restart: unless-stopped
    # -B embeds celery beat (drives the periodic reconciliation task). Fine for a
    # single worker container; use a dedicated beat process if this is scaled out.
    command: ["python", "-m", "celery", "-A", "app.services.ingestion.workers.celery_app:celery_app", "worker",
              "--loglevel=info", "-Q", "ingestion,conversation", "-c", "2", "-n", "agent-celery@%h", "-B"]
    environment:
      QDRANT_URL:             http://qdrant:6333
      BACKEND_INTERNAL_URL_BASE: http://backend:8000/api/conversations/internal
      MESSAGE_BROKER_URL:     *redis-url
      CELERY_RESULT_BACKEND:  *redis-url
      POSTGRES_DB_URL:        *pg-url
      FEATURE_FLAGS_PATH:     /app/feature_flags.json
      # Migrations run only in the agent API container; the worker must not race it.
      RUN_MIGRATIONS:         "false"
    volumes:
      - ./app/orchestrator/app:/app/app:ro
      - ./app/orchestrator/app/shared/prompts:/app/app/shared/prompts:ro
      - ./feature_flags.json:/app/feature_flags.json:ro
    networks:
      - notelite-net
